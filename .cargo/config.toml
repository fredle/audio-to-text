# whisper.cpp is built by CMake through whisper-rs-sys, which passes these
# on as CMake options. Without the first two it is compiled with no
# optimisation on MSVC and runs more than ten times slower.
# GGML_NATIVE is off so the build never depends on the CPU of the machine
# that compiles it (a CI runner with AVX-512 would make an exe that crashes
# elsewhere). AVX2, FMA and F16C are on every CPU Windows 11 supports.
[env]
CMAKE_C_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
CMAKE_CXX_FLAGS_RELEASE = "/MD /O2 /Ob2 /DNDEBUG"
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
