[package]
name = "audio_to_text"
version = "0.1.0"
edition = "2024"
description = "Turn recordings, meetings and videos into text and subtitles on your own PC, with no time limit."
repository = "https://github.com/fredle/audio-to-text"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
velopack = "1.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
